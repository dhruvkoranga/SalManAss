services:
  - name: salmanass-backend
    type: web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free tier has an ephemeral filesystem — app.db is wiped on every
    # restart/spin-down, so the seed script runs on every boot rather than
    # once. Deliberate trade-off for a demo: edits made during a live session
    # are lost after the next 15-min-idle spin-down. See docs/APPROACH.md.
    startCommand: alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FRONTEND_ORIGIN
        value: https://salmanass-frontend.onrender.com

  - name: salmanass-frontend
    type: web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_BASE_URL
        value: https://salmanass-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
